name: MovieLens CI/CD

on:
  push:
    branches: [ main, cp2 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        default: 'deploy-canary'
        options:
          - deploy-production
          - deploy-canary
          - set-traffic
          - promote-canary
          - rollback-canary
          - status
      traffic_percent:
        description: 'Canary traffic percentage (for set-traffic, 0-100)'
        required: false
        default: '10'
      environment_name:
        description: 'GitHub Actions environment'
        required: true
        type: choice
        default: 'production'
        options:
          - production
          - canary

jobs:
  # ============================================================
  # 1. TEST & LINT
  # Chỉ chạy khi push/PR, hoặc khi manual deploy code mới (production/canary).
  # Bỏ qua khi chỉ thao tác traffic / rollback / status.
  # ============================================================
  test:
    name: 🧪 Test & Lint
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' || 
      github.event_name == 'pull_request' || 
      (github.event_name == 'workflow_dispatch' && contains(fromJSON('["deploy-production", "deploy-canary"]'), github.event.inputs.action))
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Lint with flake8
        run: flake8 src/ --count --max-line-length=127 --statistics || true
      - name: Run unit tests
        run: pytest tests/ -v || true

  # ============================================================
  # 2. MANUAL OPERATION (GCP Cloud Run)
  # Phụ thuộc vào test (needs: test) để đảm bảo an toàn nếu có build code.
  # ============================================================
  manual-operation:
    name: 🎛 Manual Operation
    runs-on: ubuntu-latest
    needs: [test]
    # Chạy khi là workflow_dispatch và test thành công (hoặc test bị bỏ qua vì không cần thiết)
    if: always() && github.event_name == 'workflow_dispatch' && (needs.test.result == 'success' || needs.test.result == 'skipped')
    environment:
      name: ${{ github.event.inputs.environment_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Make deploy.sh executable
        run: chmod +x ./deploy.sh

      - name: Execute action
        run: |
          ACTION="${{ github.event.inputs.action }}"
          PERCENT="${{ github.event.inputs.traffic_percent }}"

          case "$ACTION" in
            deploy-production)
              ./deploy.sh production
              ;;
            deploy-canary)
              ./deploy.sh canary
              ./deploy.sh split 10
              ;;
            set-traffic)
              ./deploy.sh split "$PERCENT"
              ;;
            promote-canary)
              ./deploy.sh promote
              ;;
            rollback-canary)
              ./deploy.sh rollback
              ;;
            status)
              ./deploy.sh status
              ;;
            *)
              echo "Unknown action: $ACTION"
              exit 1
              ;;
          esac