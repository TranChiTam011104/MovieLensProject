name: MovieLens CI/CD

on:
  push:
    branches: [ main, cp2 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        default: 'deploy-canary'
        options:
          - deploy-production
          - deploy-canary
          - set-traffic
          - promote-canary
          - rollback-canary
          - status
      traffic_percent:
        description: 'Canary traffic percentage (for set-traffic, 0-100)'
        required: false
        default: '10'
      environment_name:
        description: 'GitHub Actions environment'
        required: true
        type: choice
        default: 'production'
        options:
          - production
          - canary

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'vsfintern' }}
  REGION: ${{ secrets.GCP_REGION || 'us-central1' }}
  SERVICE_NAME: movielens-api
  IMAGE_BASE: gcr.io/vsfintern/movielens-api

jobs:
  # ============================================================
  # 1. TEST & LINT
  # ============================================================
  test:
    name: 🧪 Test & Lint
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' || 
      github.event_name == 'pull_request' || 
      (github.event_name == 'workflow_dispatch' && contains(fromJSON('["deploy-production", "deploy-canary"]'), github.event.inputs.action))
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run code linter
        run: flake8 src/ --count --max-line-length=127 --statistics || true

      - name: Run unit tests
        run: pytest tests/ -v || true

  # ============================================================
  # 2. DEPLOYMENT & TRAFFIC ORCHESTRATION
  # ============================================================
  deploy:
    name: 🚀 Cloud Run Deployment
    runs-on: ubuntu-latest
    needs: [test]
    if: always() && github.event_name == 'workflow_dispatch' && (needs.test.result == 'success' || needs.test.result == 'skipped')
    environment:
      name: ${{ github.event.inputs.environment_name }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔑 Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: 🛠 Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: 🔧 Configure Docker CLI for GCR
        if: contains(fromJSON('["deploy-production", "deploy-canary"]'), github.event.inputs.action)
        run: gcloud auth configure-docker --quiet

      # ------------------------------------------------------------
      # BUILD & PUSH STEPS (Chỉ chạy khi deploy revision mới)
      # ------------------------------------------------------------
      - name: 🏷 Generate Build Metadata & Tag
        if: contains(fromJSON('["deploy-production", "deploy-canary"]'), github.event.inputs.action)
        id: meta
        run: |
          ACTION="${{ github.event.inputs.action }}"
          TIMESTAMP=$(date +%s)
          if [ "$ACTION" = "deploy-production" ]; then
            SUFFIX="prod-${TIMESTAMP}"
            MODEL="svd_model_full"
          else
            SUFFIX="can-${TIMESTAMP}"
            MODEL="svd_model_fold5"
          fi
          echo "suffix=${SUFFIX}" >> $GITHUB_OUTPUT
          echo "image=${IMAGE_BASE}:${SUFFIX}" >> $GITHUB_OUTPUT
          echo "model_name=${MODEL}" >> $GITHUB_OUTPUT

      - name: 📦 Build Container Image
        if: contains(fromJSON('["deploy-production", "deploy-canary"]'), github.event.inputs.action)
        run: |
          echo "Building image: ${{ steps.meta.outputs.image }}"
          docker build -t ${{ steps.meta.outputs.image }} .

      - name: 📤 Push Image to Registry
        if: contains(fromJSON('["deploy-production", "deploy-canary"]'), github.event.inputs.action)
        run: |
          echo "Pushing image: ${{ steps.meta.outputs.image }}"
          docker push ${{ steps.meta.outputs.image }}

      # ------------------------------------------------------------
      # DEPLOY STEPS
      # ------------------------------------------------------------
      - name: 🚀 Deploy Production Revision (100% Traffic)
        if: github.event.inputs.action == 'deploy-production'
        run: |
          gcloud run deploy ${SERVICE_NAME} \
            --image ${{ steps.meta.outputs.image }} \
            --platform managed \
            --region ${REGION} \
            --port 8000 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10 \
            --allow-unauthenticated \
            --revision-suffix="${{ steps.meta.outputs.suffix }}" \
            --set-env-vars "PYTHONUNBUFFERED=1,LOG_LEVEL=INFO,MODEL_NAME=${{ steps.meta.outputs.model_name }}"

      - name: 🐤 Deploy Canary Revision (0% Initial Traffic)
        if: github.event.inputs.action == 'deploy-canary'
        run: |
          gcloud run deploy ${SERVICE_NAME} \
            --image ${{ steps.meta.outputs.image }} \
            --platform managed \
            --region ${REGION} \
            --port 8000 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 5 \
            --allow-unauthenticated \
            --revision-suffix="${{ steps.meta.outputs.suffix }}" \
            --tag canary \
            --no-traffic \
            --set-env-vars "PYTHONUNBUFFERED=1,LOG_LEVEL=INFO,MODEL_NAME=${{ steps.meta.outputs.model_name }}"

      # ------------------------------------------------------------
      # TRAFFIC ROUTING STEPS
      # ------------------------------------------------------------
      - name: 🔀 Configure Canary Traffic Split (90/10)
        if: github.event.inputs.action == 'deploy-canary'
        run: |
          chmod +x ./deploy.sh
          ./deploy.sh split 10

      - name: 🎚 Set Custom Traffic Percentage
        if: github.event.inputs.action == 'set-traffic'
        run: |
          chmod +x ./deploy.sh
          ./deploy.sh split "${{ github.event.inputs.traffic_percent }}"

      - name: 🎯 Promote Canary to Production (100%)
        if: github.event.inputs.action == 'promote-canary'
        run: |
          chmod +x ./deploy.sh
          ./deploy.sh promote

      - name: 🔙 Rollback to Previous Production
        if: github.event.inputs.action == 'rollback-canary'
        run: |
          chmod +x ./deploy.sh
          ./deploy.sh rollback

      # ------------------------------------------------------------
      # VERIFICATION STEP (Chạy ở mọi hành động để đối chiếu kết quả)
      # ------------------------------------------------------------
      - name: 📊 Verify Current Traffic Status
        run: |
          chmod +x ./deploy.sh
          ./deploy.sh status