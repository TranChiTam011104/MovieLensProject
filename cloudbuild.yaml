# ============================================================
# Google Cloud Run Deployment Configuration
# ============================================================
# Deploy to Google Cloud Run

# Project configuration (thay đổi theo project của bạn)
PROJECT_ID=your-gcp-project-id
REGION=asia-southeast1
SERVICE_NAME=movielens-api

# Container image
IMAGE_NAME=gcr.io/${PROJECT_ID}/${SERVICE_NAME}

# ============================================================
# BUILD & DEPLOY STEPS
# ============================================================

# 1. Build Docker image và push lên Google Container Registry
gcloud builds submit --tag ${IMAGE_NAME}

# 2. Deploy lên Cloud Run
gcloud run deploy ${SERVICE_NAME} \
    --image ${IMAGE_NAME} \
    --platform managed \
    --region ${REGION} \
    --port 8000 \
    --memory 512Mi \
    --cpu 1 \
    --min-instances 0 \
    --max-instances 10 \
    --allow-unauthenticated \
    --set-env-vars PYTHONUNBUFFERED=1

# ============================================================
# NOTES
# ============================================================
# - Cloud Run tự động scale down về 0 khi không có traffic
# - Memory 512Mi là đủ cho MovieLens 100K dataset
# - Nếu cần train model trên cloud, cần tăng memory và dùng Cloud Build
