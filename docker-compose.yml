# ============================================================
# Docker Compose - For local development & testing
# ============================================================
# Run: docker-compose up

version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: movielens-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
    volumes:
      # Mount models directory for hot-reload during development
      - ./models:/app/models:ro
      - ./data:/app/data:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - movielens-network

networks:
  movielens-network:
    driver: bridge
