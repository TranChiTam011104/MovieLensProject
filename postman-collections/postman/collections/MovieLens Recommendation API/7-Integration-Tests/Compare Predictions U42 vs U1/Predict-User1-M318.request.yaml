$kind: http-request
url: "{{baseUrl}}/v1/predict/users/1/movies/318"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Get prediction for user 1', function() {
          pm.response.to.have.status(200);
          var jsonData = pm.response.json();
          pm.globals.set('user1_rating', jsonData.predicted_rating);
      });
order: 2000
