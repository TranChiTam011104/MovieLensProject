$kind: http-request
description: |-
  **Lấy thông tin chi tiết movie 318 (The Shawshank Redemption)**

  Endpoint: `/v1/movies/{movie_id}`

  **Response:** title, genres, release_year, avg_rating, n_ratings
url: "{{baseUrl}}/v1/movies/318"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function() {
          pm.response.to.have.status(200);
      });

      pm.test('Response has movie fields', function() {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property('movie_id');
          pm.expect(jsonData).to.have.property('title');
          pm.expect(jsonData).to.have.property('genres');
          pm.expect(jsonData.movie_id).to.eql(318);
      });

      pm.test('Genres is an array', function() {
          var jsonData = pm.response.json();
          pm.expect(jsonData.genres).to.be.an('array');
      });
order: 1000
