$kind: http-request
description: |-
  **Gợi ý top 5 phim cho user 1**

  Endpoint: `/v1/recommend/{user_id}?n=5`

  **Ý nghĩa:** Verify rằng mỗi user nhận được gợi ý khác nhau dựa trên sở thích riêng.
url: "{{baseUrl}}/v1/recommend/users/1?n=5"
method: GET
queryParams:
  n: "5"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function() {
          pm.response.to.have.status(200);
      });

      pm.test('User ID is 1', function() {
          var jsonData = pm.response.json();
          pm.expect(jsonData.user_id).to.eql(1);
      });
order: 5000
