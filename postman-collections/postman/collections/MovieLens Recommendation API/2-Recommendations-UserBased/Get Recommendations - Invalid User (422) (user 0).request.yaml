$kind: http-request
description: |-
  **Test lỗi: User ID không hợp lệ**

  Endpoint: `/v1/recommend/users/{user_id}`

  **Kịch bản:** User ID = 0 không hợp lệ (phải >= 1)
  **Response mong đợi:** 422 Unprocessable Entity
url: "{{baseUrl}}/v1/recommend/users/0"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 422 or 404', function() {
          pm.expect(pm.response.code).to.be.oneOf([422, 404]);
      });
order: 8000
