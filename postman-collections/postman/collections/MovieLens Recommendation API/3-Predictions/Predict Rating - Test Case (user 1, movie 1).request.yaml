$kind: http-request
description: |-
  **Dự đoán rating của user 1 cho movie 1**

  Endpoint: `/v1/predict/users/{user_id}/movies/{movie_id}`

  **Ý nghĩa:** Movie 1 là Toy Story - dự đoán rating của user 1 cho bộ phim này.
url: "{{baseUrl}}/v1/predict/users/1/movies/1"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function() {
          pm.response.to.have.status(200);
      });

      pm.test('Rating is valid', function() {
          var jsonData = pm.response.json();
          pm.expect(jsonData.predicted_rating).to.be.within(1, 5);
      });
order: 2000
