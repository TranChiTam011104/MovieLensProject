$kind: http-request
description: |-
  **Tìm top 5 phim tương tự movie 318**

  Endpoint: `/v1/movies/{movie_id}/similar?n=5`
url: "{{baseUrl}}/v1/movies/318/similar?n=5"
method: GET
queryParams:
  n: "5"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function() {
          pm.response.to.have.status(200);
      });

      pm.test('Returns at most 5 similar movies', function() {
          var jsonData = pm.response.json();
          pm.expect(jsonData.similar_movies.length).to.be.at.most(5);
      });
order: 2000
